<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solitium</title>
<style>
  :root {
    --bg: linear-gradient(160deg, #eef2ff 0%, #f8f4ff 50%, #e8f7ff 100%);
    --glass: rgba(255,255,255,.55);
    --glass-strong: rgba(255,255,255,.78);
    --border: rgba(255,255,255,.8);
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #5b5bd6;
    --bubble-user: #5b5bd6;
    --bubble-user-text: #fff;
    --bubble-bot: rgba(255,255,255,.85);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  [data-theme="dark"] {
    --bg: linear-gradient(160deg, #1a1b26 0%, #232542 60%, #1b2a3a 100%);
    --glass: rgba(40,42,60,.55);
    --glass-strong: rgba(45,47,68,.85);
    --border: rgba(255,255,255,.08);
    --text: #f2f2f7;
    --muted: #9a9cb5;
    --accent: #8b8cff;
    --bubble-user: #6c6eea;
    --bubble-bot: rgba(60,62,88,.8);
  }
  [data-theme="sunset"] {
    --bg: linear-gradient(160deg, #ffe6d5 0%, #ffd1e0 55%, #ffe9b8 100%);
    --accent: #e0547a;
    --bubble-user: #e0547a;
    --muted: #8a5a66;
  }
  [data-theme="mint"] {
    --bg: linear-gradient(160deg, #d9f7ee 0%, #e6fbf5 50%, #d4f1ff 100%);
    --accent: #0f9d7a;
    --bubble-user: #0f9d7a;
    --muted: #4f7b70;
  }
  [data-theme="midnight"] {
    --bg: linear-gradient(160deg, #05060d 0%, #0d1130 60%, #1a0d2e 100%);
    --glass: rgba(20,22,40,.5);
    --glass-strong: rgba(25,27,50,.85);
    --border: rgba(255,255,255,.07);
    --text: #e8e9f5;
    --muted: #8488a8;
    --accent: #a78bfa;
    --bubble-user: #7c5cf0;
    --bubble-bot: rgba(35,37,64,.8);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    transition: background .4s, color .3s;
  }
  body.font-serif { --font: Georgia, "Times New Roman", serif; }
  body.font-mono { --font: "Courier New", Consolas, monospace; }
  body.font-round { --font: "Trebuchet MS", Verdana, sans-serif; }

  .glass {
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(1.4);
    -webkit-backdrop-filter: blur(22px) saturate(1.4);
    border: 1px solid var(--border);
  }

  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }

  /* ---------- AUTH ---------- */
  #auth {
    height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .auth-card {
    width: 100%; max-width: 360px; padding: 32px 26px; border-radius: 28px;
    animation: rise .6s ease;
  }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand h1 { margin: 0; font-size: 34px; letter-spacing: -.5px; color: var(--accent); }
  .brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .tabs { display: flex; background: rgba(120,120,140,.12); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tabs button { flex: 1; padding: 9px; border-radius: 9px; color: var(--muted); transition: .25s; }
  .tabs button.active { background: var(--glass-strong); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input {
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255,255,255,.5); outline: none; transition: box-shadow .2s;
  }
  [data-theme="dark"] .field input, [data-theme="midnight"] .field input { background: rgba(0,0,0,.25); }
  .field input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .primary {
    width: 100%; padding: 13px; border-radius: 14px; background: var(--accent);
    color: #fff; font-weight: 600; margin-top: 6px; transition: transform .15s, opacity .2s;
  }
  .primary:active { transform: scale(.98); }
  .error { color: #d6336c; font-size: 13px; min-height: 18px; margin-top: 8px; text-align: center; }

  /* ---------- APP ---------- */
  #app { height: 100%; display: none; flex-direction: column; max-width: 860px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; margin: 10px 10px 0; border-radius: 18px;
  }
  header .title { font-weight: 700; color: var(--accent); font-size: 18px; }
  .header-right { display: flex; gap: 8px; align-items: center; }
  select.model {
    padding: 7px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--glass-strong); outline: none; max-width: 190px;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: var(--glass-strong); font-size: 17px; transition: transform .15s;
  }
  .icon-btn:active { transform: scale(.92); }

  #messages { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
  .empty { margin: auto; text-align: center; color: var(--muted); animation: rise .6s ease; }
  .empty h2 { color: var(--text); font-weight: 600; font-size: 22px; margin-bottom: 6px; }

  .msg { display: flex; animation: pop .35s cubic-bezier(.2,.9,.3,1.2); }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 11px 15px; border-radius: 20px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 4px 14px rgba(0,0,0,.06);
  }
  .msg.user .bubble { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-right-radius: 6px; }
  .msg.bot .bubble { background: var(--bubble-bot); backdrop-filter: blur(16px); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .caret::after { content: "▍"; animation: blink 1s steps(2) infinite; margin-left: 2px; opacity: .6; }

  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }

  .composer-wrap { padding: 8px 12px 14px; }
  .composer {
    display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 16px; border-radius: 24px;
    transition: box-shadow .25s, transform .25s;
  }
  .composer:focus-within { box-shadow: 0 8px 30px rgba(0,0,0,.08); transform: translateY(-2px); }
  .composer textarea {
    flex: 1; border: none; outline: none; background: transparent; resize: none;
    max-height: 140px; padding: 8px 0; line-height: 1.4;
  }
  .send {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 18px; transition: transform .2s, opacity .2s; flex-shrink: 0;
  }
  .send:disabled { opacity: .35; }
  .send:not(:disabled):hover { transform: scale(1.08); }

  /* ---------- SETTINGS SHEET ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none;
    align-items: flex-end; justify-content: center; z-index: 10;
  }
  .overlay.show { display: flex; animation: fade .25s; }
  .sheet {
    width: 100%; max-width: 520px; max-height: 80vh; overflow-y: auto;
    border-radius: 26px 26px 0 0; padding: 22px 20px 28px; animation: slideUp .35s ease;
    background: var(--glass-strong);
  }
  .sheet h3 { margin: 0 0 14px; }
  .sheet .row { margin-bottom: 16px; }
  .sheet .row > label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .sheet select, .sheet input {
    width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(255,255,255,.5); outline: none;
  }
  [data-theme="dark"] .sheet select, [data-theme="dark"] .sheet input,
  [data-theme="midnight"] .sheet select, [data-theme="midnight"] .sheet input { background: rgba(0,0,0,.25); }
  .themes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .swatch {
    height: 44px; border-radius: 12px; border: 2px solid transparent; transition: transform .2s;
  }
  .swatch.on { border-color: var(--accent); transform: scale(1.05); }
  .small { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .logout { color: #d6336c; font-size: 14px; margin-top: 8px; }

  body.has-bg::before { content: ""; position: fixed; inset: 0; z-index: -1; background: rgba(255,255,255,.22); pointer-events: none; }
  [data-theme="dark"] body.has-bg::before, [data-theme="midnight"] body.has-bg::before { background: rgba(0,0,0,.35); }
  .overlay.left { align-items: stretch; justify-content: flex-start; }
  .drawer {
    width: 84%; max-width: 330px; height: 100%; overflow-y: auto; padding: 20px 14px;
    border-radius: 0 26px 26px 0; background: var(--glass-strong);
    backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
    animation: slideRight .3s ease; padding-top: calc(20px + env(safe-area-inset-top, 0px));
  }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .drawer-head h3 { margin: 0; }
  .chat-item { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; border-radius: 14px; transition: background .2s; }
  .chat-item:hover, .chat-item.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .chat-item .t { flex: 1; text-align: left; padding: 11px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item .x { padding: 8px 12px; color: var(--muted); font-size: 18px; }
  .no-chats { color: var(--muted); font-size: 14px; padding: 8px 4px; }
  .bgbtns { display: flex; gap: 8px; }
  .filebtn { flex: 1; text-align: center; padding: 11px; border-radius: 12px; background: var(--glass-strong); border: 1px solid var(--border); cursor: pointer; font-size: 15px; }
  @keyframes slideRight { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  :root { --blur: 22px; --fs: 16px; --btn-r: 12px; --g-rgb: 255,255,255; --glass-a: .55; }
  [data-theme="dark"] { --g-rgb: 40,42,60; }
  [data-theme="midnight"] { --g-rgb: 20,22,40; }
  body { font-size: var(--fs); }
  .glass { background: rgba(var(--g-rgb), var(--glass-a)); backdrop-filter: blur(var(--blur)) saturate(1.4); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4); }
  .icon-btn, .primary, .send, .filebtn { border-radius: var(--btn-r); }
  .icon-btn.on { background: var(--accent); color: #fff; }
  #app[data-width="compact"] { max-width: 640px; }
  #app[data-width="wide"] { max-width: none; }
  #app[data-align="left"] { margin: 0 auto 0 0; }
  #app[data-align="right"] { margin: 0 0 0 auto; }
  #app.composer-top .composer-wrap { order: 2; }
  #app.composer-top #messages { order: 3; }
  .overlay.left.right { justify-content: flex-end; }
  .overlay.right .drawer { border-radius: 26px 0 0 26px; animation-name: slideLeft; }
  body.user-left .msg.user { justify-content: flex-start; }
  body.user-left .msg.user .bubble { border-bottom-right-radius: 20px; border-bottom-left-radius: 6px; }
  body.bubbles-square .bubble { border-radius: 8px !important; }
  body.bubbles-flat .bubble { background: transparent !important; border: none !important; box-shadow: none !important; backdrop-filter: none !important; color: var(--text) !important; max-width: 100%; padding-left: 6px; padding-right: 6px; }
  body.bubbles-flat .msg.user .bubble { border-left: 3px solid var(--accent) !important; }
  body.no-anim .msg, body.no-anim .sheet, body.no-anim .drawer, body.no-anim .empty, body.no-anim .auth-card { animation: none; }
  .loc { display: inline-block; margin-bottom: 8px; padding: 5px 12px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); font-size: .85em; font-weight: 600; }
  .fw { opacity: 0; animation: fadeW .5s forwards; }
  details { margin-bottom: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(120,120,140,.08); }
  summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }
  .sheet textarea { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,.5); outline: none; resize: vertical; }
  [data-theme="dark"] .sheet textarea, [data-theme="midnight"] .sheet textarea { background: rgba(0,0,0,.25); }
  .sheet input[type=checkbox] { width: 22px; height: 22px; }
  .sheet input[type=color] { height: 42px; padding: 2px; }
  .sheet input[type=range] { padding: 0; }
  @media (max-width: 480px) { header .title { display: none; } select.model { max-width: 125px; } }
  @keyframes slideLeft { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fadeW { to { opacity: 1; } }
  /* ---- раскладки ---- */
  #app[data-layout="dock"] header { order: 9; margin: 0 auto calc(12px + env(safe-area-inset-bottom, 0px)); width: fit-content; max-width: calc(100% - 20px); border-radius: 999px; padding: 8px 12px; }
  #app[data-layout="dock"] header .title { display: none; }
  #app[data-layout="window"] { height: calc(100% - 28px); margin-block: 14px; width: calc(100% - 20px); border-radius: 32px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 24px 70px rgba(0,0,0,.18); background: rgba(var(--g-rgb), calc(var(--glass-a) * .55)); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); }
  #app[data-layout="window"] header { margin: 0; border-radius: 0; border: none; border-bottom: 1px solid var(--border); background: transparent; backdrop-filter: none; }
  #app[data-layout="focus"] header { background: transparent; border-color: transparent; backdrop-filter: none; opacity: .3; transition: opacity .3s; }
  #app[data-layout="focus"] header:hover, #app[data-layout="focus"] header:focus-within { opacity: 1; }
  #app[data-layout="focus"] #messages, #app[data-layout="focus"] .composer-wrap { width: 100%; max-width: 720px; margin-left: auto; margin-right: auto; }
  #app[data-layout="focus"] .composer-wrap { padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); }
  @media (min-width: 820px) {
    body[data-layout="split"] #history { display: flex !important; background: transparent; pointer-events: none; right: auto; width: 310px; }
    body[data-layout="split"] .drawer { pointer-events: auto; animation: none; max-width: none; width: 100%; margin: 10px 0 10px 10px; height: calc(100% - 20px); border-radius: 26px; border: 1px solid var(--border); }
    #app[data-layout="split"] { margin-left: 320px; max-width: none; }
    body[data-layout="split"] header .icon-btn[title="Чаты"] { display: none; }
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<!-- AUTH -->
<section id="auth">
  <div class="auth-card glass">
    <div class="brand">
      <h1>Solitium</h1>
      <p>Чат с моделями Groq</p>
    </div>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Вход</button>
      <button id="tabReg" onclick="switchTab('register')">Регистрация</button>
    </div>
    <form id="authForm" onsubmit="return submitAuth(event)">
      <div class="field" id="nameField" style="display:none">
        <label>Имя</label>
        <input id="name" autocomplete="name">
      </div>
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input id="password" type="password" minlength="6" autocomplete="current-password" required>
      </div>
      <button class="primary" id="authBtn" type="submit">Войти</button>
      <div class="error" id="authError"></div>
    </form>
  </div>
</section>

<!-- APP -->
<section id="app">
  <header class="glass">
    <div style="display:flex;align-items:center;gap:10px"><button class="icon-btn" onclick="openHistory()" title="Чаты">☰</button><div class="title">Solitium</div></div>
    <div class="header-right">
      <select class="model" id="model" title="Модель"></select>
      <button class="icon-btn" id="rpBtn" onclick="toggleRp()" title="Ролевой режим">🎭</button>
      <button class="icon-btn" onclick="newChat()" title="Новый чат">＋</button>
      <button class="icon-btn" onclick="openSettings()" title="Настройки">⚙</button>
    </div>
  </header>

  <div id="messages"></div>

  <div class="composer-wrap">
    <div class="composer glass">
      <textarea id="input" rows="1" placeholder="Напишите сообщение…"></textarea>
      <button class="send" id="sendBtn" onclick="send()" disabled>↑</button>
    </div>
  </div>
</section>

<!-- HISTORY -->
<div class="overlay left" id="history" onclick="if(event.target===this)closeHistory()">
  <aside class="drawer">
    <div class="drawer-head">
      <h3>Чаты</h3>
      <button class="icon-btn" onclick="newChat();closeHistory()" title="Новый чат">＋</button>
    </div>
    <div id="chatList"></div>
  </aside>
</div>

<!-- SETTINGS -->
<div class="overlay" id="settings" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <h3>Настройки</h3>

    <div class="row">
      <label>Тема</label>
      <div class="themes" id="themes"></div>
    </div>

    <div id="extra"></div>

    <div class="row">
      <label>Свой шрифт (файл .ttf, .otf, .woff, .woff2)</label>
      <div class="bgbtns">
        <label class="filebtn">Загрузить<input type="file" accept=".ttf,.otf,.woff,.woff2" hidden onchange="uploadFont(this.files[0]);this.value=''"></label>
        <button class="filebtn" onclick="resetFont()">Сбросить</button>
      </div>
    </div>
    <div class="row"><button class="filebtn" style="width:100%" onclick="resetColors()">Сбросить цвета</button></div>

    <div class="row">
      <label>Свой фон</label>
      <div class="bgbtns">
        <label class="filebtn">Загрузить<input type="file" accept="image/*" hidden onchange="uploadBg(this.files[0]);this.value=''"></label>
        <button class="filebtn" onclick="resetBg()">Сбросить</button>
      </div>
      <div class="small">Картинка остаётся только в вашем браузере.</div>
    </div>

    <div class="row">
      <label>Groq API-ключ</label>
      <input id="apiKey" type="password" placeholder="gsk_..." oninput="saveKey(this.value)">
      <div class="small">Ключ хранится только в вашем браузере. Получить: console.groq.com</div>
    </div>

    <button class="logout" onclick="logout()">Выйти из аккаунта</button>
  </div>
</div>

<script>
  const MODELS = [
    { id: "llama-3.3-70b-versatile", name: "Llama 3.3 70B" },
    { id: "llama-3.1-8b-instant", name: "Llama 3.1 8B (быстрая)" },
  ];
  const THEMES = [
    { id: "light", color: "linear-gradient(135deg,#eef2ff,#e8f7ff)" },
    { id: "dark", color: "linear-gradient(135deg,#1a1b26,#232542)" },
    { id: "sunset", color: "linear-gradient(135deg,#ffd1e0,#ffe9b8)" },
    { id: "mint", color: "linear-gradient(135deg,#d9f7ee,#d4f1ff)" },
    { id: "midnight", color: "linear-gradient(135deg,#05060d,#1a0d2e)" },
  ];
  const FONT_CLASS = { sans: "", serif: "font-serif", mono: "font-mono", round: "font-round" };

  let messages = [], chats = [], activeId = null;
  let currentUser = JSON.parse(localStorage.getItem("solitium_session") || "null");
  let settings = Object.assign({theme:"light",font:"sans",model:"llama-3.3-70b-versatile",apiKey:"",accent:null,bubble:null,alpha:55,blur:22,fs:16,btnShape:"soft",width:"normal",align:"center",composerPos:"bottom",sidebar:"left",userSide:"right",bubbleStyle:"round",fontCustom:"",anim:"word",speed:18,caret:true,uiAnim:true,rp:false,rpStyle:"narrator",rpCards:true,rpScenario:"",layout:"classic"}, JSON.parse(localStorage.getItem("solitium_settings") || "{}"));
  const SCHEMA = [
    ["Цвета и стекло", [
      ["accent","Цвет акцента и кнопок","color"],
      ["bubble","Цвет ваших сообщений","color"],
      ["alpha","Прозрачность стекла","range",10,95,1,"%"],
      ["blur","Размытие","range",0,40,1,"px"],
      ["btnShape","Форма кнопок","select",[["soft","Скруглённые"],["round","Круглые"],["square","Квадратные"]]]]],
    ["Расположение", [
      ["layout","Раскладка всего интерфейса","select",[["classic","Классика"],["dock","Док: панель внизу"],["window","Окно поверх фона"],["split","Две колонки: чаты слева"],["focus","Фокус: минимум элементов"]]],
      ["width","Ширина","select",[["compact","Узкая"],["normal","Обычная"],["wide","Во весь экран"]]],
      ["align","Положение на экране","select",[["center","По центру"],["left","Слева"],["right","Справа"]]],
      ["composerPos","Поле ввода","select",[["bottom","Снизу"],["top","Сверху"]]],
      ["sidebar","Панель чатов","select",[["left","Слева"],["right","Справа"]]],
      ["userSide","Ваши сообщения","select",[["right","Справа"],["left","Слева"]]],
      ["bubbleStyle","Стиль сообщений","select",[["round","Пузыри"],["square","Квадратные"],["flat","Без пузырей"]]]]],
    ["Текст и анимация", [
      ["font","Шрифт","select",[["sans","Системный"],["serif","С засечками"],["mono","Моноширинный"],["round","Округлый"],["hand","Рукописный"]]],
      ["fontCustom","Название своего шрифта (установленного)","text"],
      ["fs","Размер текста","range",13,22,1,"px"],
      ["anim","Анимация текста","select",[["word","По словам"],["char","По буквам"],["fade","Плавное проявление"],["none","Без анимации"]]],
      ["speed","Задержка анимации","range",5,80,1,"мс"],
      ["caret","Мигающий курсор","checkbox"],
      ["uiAnim","Анимации интерфейса","checkbox"]]],
    ["Ролевой режим", [
      ["rp","Включить ролевой режим","checkbox"],
      ["rpStyle","Стиль ведения","select",[["narrator","Рассказчик"],["dialog","Диалог от лица персонажа"],["quest","Текстовый квест"]]],
      ["rpCards","Карточки локаций","checkbox"],
      ["rpScenario","Сценарий и персонажи","textarea"]]]
  ];
  const FONT_MAP = {
    sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
    serif: 'Georgia, "Times New Roman", serif',
    mono: '"Courier New", Consolas, monospace',
    round: '"Trebuchet MS", Verdana, sans-serif',
    hand: '"Bradley Hand", "Segoe Print", "Comic Sans MS", cursive'
  };
  let customFontLoaded = false;
  function buildExtra() {
    const box = document.getElementById("extra");
    SCHEMA.forEach(([title, items]) => {
      const d = document.createElement("details"); d.open = title === "Расположение";
      const sm = document.createElement("summary"); sm.textContent = title; d.appendChild(sm);
      items.forEach(([k, label, type, a, b, c, u]) => {
        const row = document.createElement("div"); row.className = "row";
        const lb = document.createElement("label"); let el;
        if (type === "select") { el = document.createElement("select"); a.forEach(([v, t]) => el.add(new Option(t, v))); }
        else if (type === "textarea") { el = document.createElement("textarea"); el.rows = 3; }
        else { el = document.createElement("input"); el.type = type; if (type === "range") { el.min = a; el.max = b; el.step = c; } }
        el.dataset.k = k;
        if (type === "checkbox") el.checked = !!settings[k];
        else el.value = settings[k] ?? (type === "color" ? "#5b5bd6" : "");
        const setLb = () => lb.textContent = label + (type === "range" ? ": " + el.value + u : "");
        setLb();
        el.addEventListener("input", () => {
          settings[k] = type === "checkbox" ? el.checked : type === "range" ? Number(el.value) : el.value;
          setLb(); saveSettings(); applyAll();
          if (k === "rp") renderMessages();
        });
        row.append(lb, el); d.appendChild(row);
      });
      box.appendChild(d);
    });
  }
  function applyAll() {
    const r = document.documentElement, st = r.style, S = settings;
    r.setAttribute("data-theme", S.theme);
    [["--accent", S.accent], ["--bubble-user", S.bubble || S.accent]].forEach(([v, x]) => x ? st.setProperty(v, x) : st.removeProperty(v));
    st.setProperty("--glass-a", S.alpha / 100); st.setProperty("--blur", S.blur + "px"); st.setProperty("--fs", S.fs + "px");
    st.setProperty("--btn-r", { soft: "12px", round: "999px", square: "4px" }[S.btnShape] || "12px");
    const app = document.getElementById("app"); app.dataset.layout = S.layout; document.body.dataset.layout = S.layout; app.dataset.width = S.width; app.dataset.align = S.align;
    app.classList.toggle("composer-top", S.composerPos === "top");
    document.getElementById("history").classList.toggle("right", S.sidebar === "right");
    const b = document.body.classList;
    b.toggle("user-left", S.userSide === "left"); b.toggle("bubbles-square", S.bubbleStyle === "square");
    b.toggle("bubbles-flat", S.bubbleStyle === "flat"); b.toggle("no-anim", !S.uiAnim);
    document.getElementById("rpBtn").classList.toggle("on", !!S.rp);
    document.querySelectorAll(".swatch").forEach(x => x.classList.toggle("on", x.dataset.theme === S.theme));
    applyFont();
  }
  function resetColors() { settings.accent = null; settings.bubble = null; saveSettings(); applyAll(); }
  function toggleRp() {
    settings.rp = !settings.rp; saveSettings(); applyAll();
    const cb = document.querySelector('[data-k="rp"]'); if (cb) cb.checked = settings.rp;
    renderMessages();
  }
  async function loadCustomFont() {
    document.fonts.forEach(f => { if (f.family.replace(/"/g, "") === "SolitiumCustom") document.fonts.delete(f); });
    let d = null; try { d = localStorage.getItem("solitium_font"); } catch (e) {}
    customFontLoaded = false;
    if (d) { try { const f = new FontFace("SolitiumCustom", "url(" + d + ")"); await f.load(); document.fonts.add(f); customFontLoaded = true; } catch (e) {} }
    applyFont();
  }
  function uploadFont(file) {
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { alert("Файл шрифта больше 3 МБ"); return; }
    const r = new FileReader();
    r.onload = () => {
      try { localStorage.setItem("solitium_font", r.result); } catch (e) { alert("Не удалось сохранить шрифт"); return; }
      loadCustomFont();
    };
    r.readAsDataURL(file);
  }
  function resetFont() { try { localStorage.removeItem("solitium_font"); } catch (e) {} loadCustomFont(); }
  function splitLoc(t) {
    const m = settings.rpCards && t.match(/^\s*📍\s*([^\n]+)\n*/);
    return m ? { loc: m[1].trim(), body: t.slice(m[0].length) } : { loc: null, body: t };
  }
  function buildBot(bubble, loc) {
    bubble.textContent = "";
    if (loc) { const c = document.createElement("div"); c.className = "loc"; c.textContent = "📍 " + loc; bubble.appendChild(c); }
    const sp = document.createElement("span"); bubble.appendChild(sp); return sp;
  }
  function systemPrompt() {
    if (!settings.rp) return "Ты дружелюбный ассистент. Отвечай по-русски.";
    const st = { narrator: "Пиши от третьего лица как рассказчик: описывай сцены и реплики персонажей.", dialog: "Отвечай репликами персонажа от первого лица, действия пиши в *звёздочках*.", quest: "Веди текстовый квест: описывай ситуацию и в конце предлагай 2–4 варианта действий." }[settings.rpStyle];
    let p = "Ты ведущий ролевой игры. Отвечай по-русски. " + st;
    if (settings.rpScenario.trim()) p += " Сценарий и персонажи: " + settings.rpScenario.trim();
    if (settings.rpCards) p += " Когда сцена переносится в новое место, начинай ответ отдельной строкой «📍 Название локации», затем описание.";
    return p + " Не выходи из роли и не пиши за игрока.";
  }

  // ----- init -----
  function init() {
    const sel = document.getElementById("model");
    MODELS.forEach(m => sel.add(new Option(m.name, m.id)));
    sel.value = settings.model;
    sel.onchange = () => { settings.model = sel.value; saveSettings(); };

    const wrap = document.getElementById("themes");
    THEMES.forEach(t => {
      const b = document.createElement("button");
      b.className = "swatch"; b.style.background = t.color; b.dataset.theme = t.id;
      b.title = t.id; b.onclick = () => setTheme(t.id);
      wrap.appendChild(b);
    });

    document.getElementById("apiKey").value = settings.apiKey;
    buildExtra(); applyAll(); loadCustomFont(); applyBg();

    if (currentUser) showApp(); else showAuth();
  }

  function saveSettings() { localStorage.setItem("solitium_settings", JSON.stringify(settings)); }
  function saveKey(v) { settings.apiKey = v.trim(); saveSettings(); }
  function setTheme(t) { settings.theme = t; saveSettings(); applyTheme(); }
  function setFont(f) { settings.font = f; saveSettings(); applyFont(); }
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", settings.theme);
    document.querySelectorAll(".swatch").forEach(s => s.classList.toggle("on", s.dataset.theme === settings.theme));
  }
  function applyFont() {
    let fam = FONT_MAP[settings.font] || FONT_MAP.sans;
    const cn = (settings.fontCustom || "").trim().replace(/["']/g, "");
    if (cn) fam = '"' + cn + '", ' + fam;
    if (customFontLoaded) fam = '"SolitiumCustom", ' + fam;
    document.body.style.setProperty("--font", fam);
  }
  function applyBg() {
    let d = null;
    try { d = localStorage.getItem("solitium_bg"); } catch (e) {}
    if (d) {
      document.body.style.backgroundImage = 'url("' + d + '")';
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      document.body.classList.add("has-bg");
    } else {
      document.body.style.backgroundImage = "";
      document.body.classList.remove("has-bg");
    }
  }
  function uploadBg(file) {
    if (!file) return;
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try { localStorage.setItem("solitium_bg", c.toDataURL("image/jpeg", 0.8)); }
      catch (e) { alert("Не удалось сохранить: картинка слишком большая."); }
      URL.revokeObjectURL(url); applyBg();
    };
    img.onerror = () => alert("Не удалось открыть изображение.");
    img.src = url;
  }
  function resetBg() { try { localStorage.removeItem("solitium_bg"); } catch (e) {} applyBg(); }

  // ----- auth (демо: данные хранятся в браузере) -----
  let mode = "login";
  function switchTab(m) {
    mode = m;
    document.getElementById("tabLogin").classList.toggle("active", m === "login");
    document.getElementById("tabReg").classList.toggle("active", m === "register");
    document.getElementById("nameField").style.display = m === "register" ? "flex" : "none";
    document.getElementById("authBtn").textContent = m === "login" ? "Войти" : "Создать аккаунт";
    document.getElementById("authError").textContent = "";
  }

  async function hash(s) {
    const data = new TextEncoder().encode(s);
    const buf = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function submitAuth(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const pass = document.getElementById("password").value;
    const name = document.getElementById("name").value.trim();
    const err = document.getElementById("authError");
    const users = JSON.parse(localStorage.getItem("solitium_users") || "{}");
    const h = await hash(pass);

    if (mode === "register") {
      if (!name) { err.textContent = "Введите имя"; return false; }
      if (users[email]) { err.textContent = "Такой email уже зарегистрирован"; return false; }
      users[email] = { name, hash: h };
      localStorage.setItem("solitium_users", JSON.stringify(users));
    } else {
      if (!users[email] || users[email].hash !== h) { err.textContent = "Неверный email или пароль"; return false; }
    }
    currentUser = { email, name: users[email].name };
    localStorage.setItem("solitium_session", JSON.stringify(currentUser));
    showApp();
    return false;
  }

  function logout() {
    localStorage.removeItem("solitium_session");
    currentUser = null; closeSettings(); showAuth();
  }

  function showAuth() {
    document.getElementById("auth").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
  function showApp() {
    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "flex";
    loadChats(); renderMessages(); renderChatList();
  }

  // ----- chat -----
  const input = document.getElementById("input");
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
    document.getElementById("sendBtn").disabled = !input.value.trim();
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  function renderMessages() {
    const box = document.getElementById("messages");
    box.innerHTML = "";
    if (!messages.length) {
      box.innerHTML = `<div class="empty"><h2>Привет, ${escape(currentUser?.name || "")}</h2><div>${settings.rp ? "Ролевой режим: опишите, с чего начнём игру." : "Чем помочь сегодня?"}</div></div>`;
      return;
    }
    messages.forEach(m => box.appendChild(makeBubble(m.role, m.content)));
    box.scrollTop = box.scrollHeight;
  }

  function makeBubble(role, text, cls = "") {
    const row = document.createElement("div");
    row.className = "msg " + (role === "user" ? "user" : "bot");
    row.innerHTML = `<div class="bubble ${cls}"></div>`;
    const bub = row.querySelector(".bubble");
    if (role === "user") bub.textContent = text;
    else { const q = splitLoc(text); buildBot(bub, q.loc).textContent = q.body; }
    return row;
  }

  function scrollDown() { const b = document.getElementById("messages"); b.scrollTop = b.scrollHeight; }
  function escape(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function newChat() { messages = []; activeId = null; renderMessages(); renderChatList(); }

  // ----- history -----
  function chatKey() { return "solitium_chats_" + currentUser.email; }
  function loadChats() {
    try { chats = JSON.parse(localStorage.getItem(chatKey()) || "[]"); } catch (e) { chats = []; }
    messages = []; activeId = null;
  }
  function saveChats() { try { localStorage.setItem(chatKey(), JSON.stringify(chats)); } catch (e) {} }
  function persist() {
    if (!messages.length) return;
    let c = chats.find(x => x.id === activeId);
    if (!c) {
      c = { id: Date.now().toString(36), title: messages[0].content.slice(0, 40), messages: [] };
      chats.unshift(c); activeId = c.id;
    }
    c.messages = messages.slice();
    saveChats(); renderChatList();
  }
  function renderChatList() {
    const box = document.getElementById("chatList");
    box.innerHTML = "";
    if (!chats.length) {
      const d = document.createElement("div");
      d.className = "no-chats"; d.textContent = "Пока нет сохранённых чатов";
      box.appendChild(d); return;
    }
    chats.forEach(c => {
      const row = document.createElement("div");
      row.className = "chat-item" + (c.id === activeId ? " on" : "");
      const t = document.createElement("button");
      t.className = "t"; t.textContent = c.title; t.onclick = () => openChat(c.id);
      const x = document.createElement("button");
      x.className = "x"; x.textContent = "×"; x.title = "Удалить"; x.onclick = () => deleteChat(c.id);
      row.append(t, x); box.appendChild(row);
    });
  }
  function openChat(id) {
    const c = chats.find(x => x.id === id);
    if (!c) return;
    messages = c.messages.slice(); activeId = id;
    renderMessages(); renderChatList(); closeHistory();
  }
  function deleteChat(id) {
    chats = chats.filter(x => x.id !== id);
    saveChats();
    if (id === activeId) { messages = []; activeId = null; renderMessages(); }
    renderChatList();
  }
  function openHistory() { renderChatList(); document.getElementById("history").classList.add("show"); }
  function closeHistory() { document.getElementById("history").classList.remove("show"); }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    if (!settings.apiKey) { openSettings(); document.getElementById("apiKey").focus(); return; }

    messages.push({ role: "user", content: text });
    persist();
    input.value = ""; input.style.height = "auto";
    document.getElementById("sendBtn").disabled = true;
    renderMessages();

    const box = document.getElementById("messages");
    const typing = document.createElement("div");
    typing.className = "msg bot";
    typing.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    box.appendChild(typing); scrollDown();

    try {
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + settings.apiKey },
        body: JSON.stringify({
          model: settings.model,
          messages: [{ role: "system", content: systemPrompt() }, ...messages],
        }),
      });
      if (!res.ok) throw new Error("Ошибка API: " + res.status);
      const data = await res.json();
      const reply = data.choices[0].message.content;
      messages.push({ role: "assistant", content: reply });
      persist();
      await revealText(typing, reply);
    } catch (err) {
      typing.remove();
      messages.push({ role: "assistant", content: "Не удалось получить ответ. " + err.message });
      renderMessages();
    }
  }

  // Эффект печати: текст появляется по словам
  async function revealText(row, text) {
    const bubble = row.querySelector(".bubble"), q = splitLoc(text), sp = buildBot(bubble, q.loc), sl = ms => new Promise(r => setTimeout(r, ms));
    const mode = settings.anim, sd = settings.speed;
    if (mode === "none") { sp.textContent = q.body; scrollDown(); return; }
    if (settings.caret) bubble.classList.add("caret");
    if (mode === "fade") {
      const toks = q.body.split(/(\s+)/), words = toks.filter(t => t.trim()).length, per = Math.min(sd, 5000 / Math.max(words, 1));
      let i = 0;
      toks.forEach(t => { if (!t.trim()) { sp.appendChild(document.createTextNode(t)); return; } const w = document.createElement("span"); w.className = "fw"; w.textContent = t; w.style.animationDelay = (i++ * per) + "ms"; sp.appendChild(w); });
      const total = words * per + 500, t0 = Date.now();
      while (Date.now() - t0 < total) { scrollDown(); await sl(120); }
    } else if (mode === "char") {
      for (let i = 0; i < q.body.length; i += 2) { sp.textContent = q.body.slice(0, i + 2); scrollDown(); await sl(Math.max(4, sd / 2)); }
    } else {
      for (const w of q.body.split(/(\s+)/)) { sp.textContent += w; scrollDown(); await sl(sd); }
    }
    bubble.classList.remove("caret");
  }

  // ----- settings sheet -----
  function openSettings() { document.getElementById("settings").classList.add("show"); }
  function closeSettings() { document.getElementById("settings").classList.remove("show"); }

  init();
</script>
</body>
